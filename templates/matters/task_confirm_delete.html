{% extends 'base.html' %}
{% block title %}Delete Task — TaskMatters{% endblock %}
{% block content %}
<div class="confirm-delete">
    <div class="card">
        <div class="card-header"><h3 style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> Delete Task</h3></div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>"{{ task.title }}"</strong>?</p>
            <p style="color: var(--text-secondary); margin-top: 8px;">This action cannot be undone.</p>
            <form method="POST" class="mt-2">{% csrf_token %}<div class="flex gap-1"><button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button><a href="{% url 'task_detail' task.id %}" class="btn btn-outline">Cancel</a></div></form>
        </div>
    </div>
</div>
{% endblock %}
